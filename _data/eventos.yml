# Eventos del grupo.
#
# «proximo» es el evento destacado en la portada y en Eventos.
# Si no hay ninguno previsto, borrar el bloque entero o dejar «proximo:» vacío.

proximo:
  etiqueta: VIII JEDE
  titulo: VIII Congreso de Jóvenes Investigadores en Diseño de Experimentos y Bioestadística
  titulo_portada: VIII Congreso de Jóvenes Investigadores en Diseño de Experimentos y Bioestadística (JEDE)
  descripcion: Para investigadores menores de 35 años, predoctorales o en los dos años siguientes a su doctorado.
  fechas: 6–9 de julio de 2027
  nota_fechas: Fechas provisionales
  lugar: "[Sede], [Ciudad]"
  web: https://kezrael.github.io/jedeviii/

